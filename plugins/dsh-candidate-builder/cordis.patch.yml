# dsh-candidate-builder: directory-confined subagents.
#
# Two rows. The PROVIDER row must stay on the host plane — `ctx.subagents` is a
# process registry and a provider name may be registered only once — so it
# belongs in a profile layer and cannot move into an agent preset.
#
# The TOOL row is free. Left here it is global, so every preset in the profile
# can call `candidate-builder`. To give it to one preset only, move the tool row
# into the `plugins` list of that preset's `@deepseek-ai/dsh-agent-preset`
# declaration instead; the provider row stays here either way.
- insert:
    - id: subagent-candidate-builder
      name: dsh-candidate-builder
      config:
        providerName: candidate-builder

    - id: tool-candidate-builder
      name: dsh-candidate-builder/tool
      config:
        provider: candidate-builder
        toolName: candidate-builder
