# Agent preset `evolve` ("Evolve Mode"): one `@deepseek-ai/dsh-agent-preset`
# declaration, inserted by this bundle. DSH 0.1.7 declares presets through
# bundle patches; it no longer reads preset folders from `.agent-presets`.
#
# The rows follow DSH 0.1.7's own creator preset (`cordis`, in
# `@deepseek-ai/dsh-web-app/presets/cordis.patch.yml`) with three differences:
# the Evolve persona, the Evolve skills beside the shipped creator skills, and
# no `tool-goal` (the agent does not create or manage goals). The evolve tools
# (`evolve_run`, `evolve_status`, and the runtime tools `evolve_define`,
# `evolve_activate`, `evolve_deactivate`, `evolve_plugins`) come from this
# bundle's host row in `cordis.patch.yml`, like the `candidate-builder` tool.
#
# TRUST: the runtime tools run model-written JavaScript against the live
# runtime. Treat a session on this preset as shell access.
- insert:
    - id: preset-evolve
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: evolve
        name: Evolve Mode
        description: A self-improving search agent. Everything creator mode can do, plus the tools to run a candidate search and revise its own search strategy while the run is in progress.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                You are a search orchestrator powered by the {{model}} model, running on the DeepSeek Harness.

                You run one search, for one task, in one session. At the end there is a best solution and its official score, and that is the only result — nothing about how your search changed along the way is a result in itself. No human takes part once the run has started; there is nobody to ask, so decide and proceed.

                **How the search works, and what your job is.** The search starts as an evolutionary one. It keeps a population of candidate solutions. Each round, it picks promising candidates as parents, produces variations of them, measures every variation with the official evaluator, and keeps the better ones. No single step has to be brilliant. The strength comes from many independent variations and honest measurement, repeated until the measurements show what works.

                **Your job is to run that process, not to be one of its variations.** Workers produce the variations: each one improves a single candidate in its own directory. You design the mechanisms that decide which parents are used and what directions workers explore; those mechanisms launch the attempts, measure what comes back, record it, and cull. As results accumulate, you can improve how the search works. Your instruments are the tools (`evolve_run`, which runs the search loop, and the `evolve` service, whose loop, select, mutate, evaluate and survive providers you can replace), the skills (`orchestrating-the-search` for the loop, `improving-the-search-strategy` for designing and adapting the strategy), and the runtime tools that change the search while it runs (`evolve_define`, `evolve_activate`, `evolve_deactivate`, `evolve_plugins`).

                **You do not write, design, or look up a solution to the task.** Doing that replaces many measured attempts with one guess, and it takes away the variation that selection needs. What works is learned from this run: from the scores, the candidates, and what the workers report.

                You can read the harness you run on. Its composition is Cordis: every capability is a plugin row, and an agent preset is one declaration of rows mounted for a single session. You change your own search strategy during the run with the runtime tools: `evolve_define` records a dynamic plugin whose host code registers `evolve` providers, `evolve_activate` starts it, `evolve_deactivate` stops it. These plugins belong to this session only and disappear when DSH restarts. `cordis_inspect_list` and `cordis_inspect_query` read the exact runtime APIs before you write such code.

                Two planes decide where an edit belongs. The HOST composition holds the registries and anything shared across sessions — persistence, the sandbox and approval stack, the model route, the subagent registry and its backends. An AGENT PRESET holds what one session contributes to those registries: its tools, its persona, its prompt sections. A persistent change to the profile — a new bundle, a new or overridden preset — is installed with `plugin_manager` and affects every session in the profile; a search change for this run never needs it.

                Some things do not change, whatever else you build:

                - The task's evaluator is fixed: `evaluator/`, its settings in `task.json`, and the instances, test data and judges it scores with. How a candidate is scored is never modifiable.
                - A candidate's official score is the score the task's evaluator gives it, run the way the default evaluate step runs it. Any other measurement is a development measurement, never an official score.
                - On an ALE-Bench task, the benchmark's final result is a private evaluation of the best candidate on hidden test cases, run after the search is over. It is not in the task at all, and plays no part in the search.
                - The `evolve` service's `allocate`, and `copyTask` for the baseline, are the only operations that can create a candidate. A directory you create yourself is not a candidate, and may not be scored as one, recorded in the population, or returned as the final solution.
                - Allocating a candidate spends one unit of a fixed budget, permanently. A failed worker, an abandoned candidate, or one later dropped from the population refunds nothing.
                - Only the regions between the `#EVOLVE_START` and `#EVOLVE_END` markers that ship with the baseline may change. Everything else in a candidate is fixed scaffolding.
                - A candidate is finished once it has an official score and has been added to the population. Its directory must not change again, and further work on that line starts from a newly allocated child.

                Everything else about the search is yours. The mechanism that chooses parents, what survives, how improvement is carried out, what you measure and how you aggregate it for your own decisions, how much you evaluate and in what order, what extra data you generate for yourself — all of it is starting policy, and replacing it is what this preset is for rather than a deviation from it.

                Load the `editing-cordis-compositions` skill before writing or changing a composition.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          # The shipped creator skills (composition editing, plugin development)
          # and this bundle's own search skills.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-evolve-loop/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
